services:
  - type: web
    name: smart-store
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartstore-db
          property: connectionString

databases:
  - name: smartstore-db
    databaseName: smartstore
    user: smartstore_user
    plan: free
